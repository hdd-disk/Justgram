name: Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 12.10.0)'
        required: false
      version_code:
        description: 'Version Code (e.g. 7031)'
        required: false
      comment:
        description: 'Optional comment for the release'
        required: false
        default: ''

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt update && sudo apt install -y git curl ninja-build meson nasm cmake pkg-config gperf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Native Build Symlinks
        run: |
          sudo mkdir -p /var/tmp
          sudo ln -s $(pwd)/TMessagesProj/jni /var/tmp/mg-jni
          sudo ln -s $ANDROID_NDK_HOME /var/tmp/mg-ndk
          sudo mkdir -p /var/tmp/mg-rustup /var/tmp/mg-cargo
          sudo chmod -R 777 /var/tmp

      - name: Extract Version from gradle.properties
        id: get_version
        run: |
          VERSION_NAME_PROP=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2)
          VERSION_CODE_PROP=$(grep 'APP_VERSION_CODE' gradle.properties | cut -d'=' -f2)
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME=$VERSION_NAME_PROP; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE=$VERSION_CODE_PROP; fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        if: env.SIGN_BASE64 != ''
        env:
          SIGN_BASE64: ${{ secrets.SIGN_BASE64 }}
        run: |
          echo "$SIGN_BASE64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Build Release APKs (arm64 and arm32)
        run: ./gradlew assemblearm64-v8arelease assemblearmeabi-v7arelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGN_ALIAS_NAME }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGN_ALIAS_PASSWORD }}

      - name: Generate Changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: changelog.md

      - name: Prepare Release Body
        run: |
          COMMENT="${{ github.event.inputs.comment }}"
          if [ -n "$COMMENT" ]; then
            echo -e "$COMMENT\n" > release_body.md
          fi
          cat changelog.md >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ steps.get_version.outputs.version_name }}_${{ steps.get_version.outputs.version_code }}
          name: Release ${{ steps.get_version.outputs.version_name }}
          body_path: release_body.md
          prerelease: false
          files: TMessagesProj_App/build/outputs/apk/*/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
