name: Release Build

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and Upload Release APKs
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt update && sudo apt install -y git curl ninja-build meson nasm cmake pkg-config gperf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Native Build Symlinks
        run: |
          sudo mkdir -p /var/tmp
          sudo ln -s $(pwd)/TMessagesProj/jni /var/tmp/mg-jni
          sudo ln -s $ANDROID_NDK_HOME /var/tmp/mg-ndk
          sudo mkdir -p /var/tmp/mg-rustup /var/tmp/mg-cargo
          sudo chmod -R 777 /var/tmp

      - name: Increment Version Code
        run: |
          VERSION_CODE=$(grep 'APP_VERSION_CODE' gradle.properties | cut -d'=' -f2)
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          sed -i "s/APP_VERSION_CODE=$VERSION_CODE/APP_VERSION_CODE=$NEW_VERSION_CODE/" gradle.properties
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add gradle.properties
          git commit -m "chore: bump version code to $NEW_VERSION_CODE [skip ci]"
          git push

      - name: Decode Keystore
        if: env.SIGN_BASE64 != ''
        env:
          SIGN_BASE64: ${{ secrets.SIGN_BASE64 }}
        run: |
          echo "$SIGN_BASE64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Create local.properties
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGN_PASSWORD }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGN_ALIAS_NAME }}" >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGN_ALIAS_PASSWORD }}" >> local.properties

      - name: Build Release APKs (arm64 and arm32)
        run: ./gradlew assemblearm64-v8arelease assemblearmeabi-v7arelease

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: TMessagesProj_App/build/outputs/apk/*/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
