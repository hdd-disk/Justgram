name: Beta Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Beta APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt update && sudo apt install -y git curl ninja-build meson nasm cmake pkg-config gperf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Native Build Symlinks
        run: |
          sudo mkdir -p /var/tmp
          sudo ln -s $(pwd)/TMessagesProj/jni /var/tmp/mg-jni
          sudo ln -s $ANDROID_NDK_HOME /var/tmp/mg-ndk
          sudo mkdir -p /var/tmp/mg-rustup /var/tmp/mg-cargo
          sudo chmod -R 777 /var/tmp

      - name: Extract Version from gradle.properties
        id: get_version
        run: |
          VERSION_NAME=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep 'APP_VERSION_CODE' gradle.properties | cut -d'=' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Beta APKs (arm64 and arm32)
        run: ./gradlew assemblearm64-v8arelease assemblearmeabi-v7arelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGN_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGN_ALIAS_NAME || 'androidkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGN_ALIAS_PASSWORD || 'android' }}

      - name: Upload Beta APKs
        uses: actions/upload-artifact@v4
        with:
          name: beta-apks-${{ steps.get_version.outputs.version_name }}-${{ steps.get_version.outputs.version_code }}
          path: TMessagesProj_App/build/outputs/apk/*/release/*.apk
