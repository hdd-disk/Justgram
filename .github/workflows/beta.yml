name: Beta Build

on:
  push:
    tags:
      - 'v*-beta'
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog:'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write 

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Dependencies
        run: |
          sdkmanager "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build gperf meson libuv1-dev nasm cmake \
            autoconf automake libtool pkg-config bash git

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python venv with uv
        run: |
          uv venv .venv --python 3.11 --seed
          uv pip install --python .venv/bin/python "cython==3.0.11"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Extract Beta Version and Tag
        id: beta_version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            BASE="${RAW_TAG#v}"
            if [[ "$BASE" != *"beta"* ]]; then
              BASE="${BASE}-beta"
            fi
            echo "APP_VERSION=$BASE" >> $GITHUB_ENV
            echo "BETA_TAG=v$BASE" >> $GITHUB_ENV
          else
            VERSION=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
            echo "APP_VERSION=${VERSION}-beta.${{ github.run_number }}" >> $GITHUB_ENV
            echo "BETA_TAG=v${VERSION}-beta.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Prepare Changelog
        run: |
          if [ -n "${{ github.event.inputs.changelog }}" ]; then
            echo "${{ github.event.inputs.changelog }}" > changelog.txt
          elif [ -f "RELEASE_NOTES.md" ]; then
            cat RELEASE_NOTES.md > changelog.txt
          else
            touch changelog.txt
          fi

      - name: Decode Keystore
        run: |
          mkdir -p TMessagesProj/config
          echo "${{ secrets.SIGN_BASE64 }}" | base64 --decode > TMessagesProj/config/release.keystore

      - name: Create local.properties
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGN_PASSWORD }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGN_ALIAS_NAME }}" >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGN_ALIAS_PASSWORD }}" >> local.properties

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            /var/tmp/mg-rustup
            /var/tmp/mg-cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('TMessagesProj/jni/setup_rust.sh') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Build APKs
        run: ./gradlew assembleBundleNormalDebug assembleBundlePluginDebug --stacktrace

      - name: Upload Beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BETA_TAG }}
          name: Beta v${{ env.APP_VERSION }}
          body_path: changelog.txt
          prerelease: true
          files: |
            TMessagesProj_App/build/outputs/apk/**/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
