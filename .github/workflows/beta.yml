name: Beta Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      comment:
        description: 'Optional comment for the release'
        required: false
        default: ''

jobs:
  build:
    name: Build Beta APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt update && sudo apt install -y git curl ninja-build meson nasm cmake pkg-config gperf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Native Build Symlinks
        run: |
          sudo mkdir -p /var/tmp
          sudo ln -s $(pwd)/TMessagesProj/jni /var/tmp/mg-jni
          sudo ln -s $ANDROID_NDK_HOME /var/tmp/mg-ndk
          sudo mkdir -p /var/tmp/mg-rustup /var/tmp/mg-cargo
          sudo chmod -R 777 /var/tmp

      - name: Extract Version from gradle.properties
        id: get_version
        run: |
          VERSION_NAME=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep 'APP_VERSION_CODE' gradle.properties | cut -d'=' -f2)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        if: env.SIGN_BASE64 != ''
        env:
          SIGN_BASE64: ${{ secrets.SIGN_BASE64 }}
        run: |
          echo "$SIGN_BASE64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Create local.properties
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGN_PASSWORD || 'android' }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGN_ALIAS_NAME || 'androidkey' }}" >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGN_ALIAS_PASSWORD || 'android' }}" >> local.properties

      - name: Build Beta APKs (arm64 and arm32)
        run: ./gradlew assemblearm64-v8arelease assemblearmeabi-v7arelease

      - name: Generate Changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ github.event.before }}..${{ github.event.after }}
        env:
          OUTPUT: changelog.md

      - name: Prepare Release Body
        run: |
          COMMENT="${{ github.event.inputs.comment }}"
          CHANGELOG=$(cat changelog.md)
          VERSION="${{ steps.get_version.outputs.version_name }}"
          COMMIT="${{ steps.get_version.outputs.commit_hash }}"
          
          if [ -n "$COMMENT" ]; then
            echo -e "$COMMENT\n" > release_body.md
          fi
          cat changelog.md >> release_body.md
          echo -e "\n---\n**Version:** $VERSION\n**Commit:** $COMMIT" >> release_body.md

      - name: Create Beta Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: beta-${{ steps.get_version.outputs.version_name }}-${{ github.run_number }}
          name: Beta ${{ steps.get_version.outputs.version_name }} (build ${{ github.run_number }})
          body_path: release_body.md
          prerelease: true
          files: TMessagesProj_App/build/outputs/apk/*/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
