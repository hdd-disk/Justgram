def nativeTarget = getProps('NATIVE_TARGET') ?: System.getenv('NATIVE_TARGET') ?: (project.hasProperty('NATIVE_TARGET') ? project.property('NATIVE_TARGET') : '')

// Plugin package is arm-only: shadowhook doesn't support x86.
def pluginAbis = ['armeabi-v7a', 'arm64-v8a']
def normalAbis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']

// Java runtime classes come from src/plugin/java/com/chaquo (see README there).
def chaquopyTargetVersion = '3.11.10-1'
def chaquopyPluginVersion = '16.1.0'
def chaquopyAbis = pluginAbis.findAll { nativeTarget.isBlank() || it == nativeTarget }
def abiToNdkTriple = [
    'armeabi-v7a': 'arm-linux-androideabi',
    'arm64-v8a'  : 'aarch64-linux-android',
]

def ndkHostTag = {
    def os = OperatingSystem.current()
    if (os.isWindows()) {
        return 'windows-x86_64'
    }
    if (os.isLinux()) {
        return 'linux-x86_64'
    }
    if (os.isMacOsX()) {
        return System.getProperty('os.arch') == 'aarch64' ? 'darwin-arm64' : 'darwin-x86_64'
    }
    throw new GradleException("Unsupported host OS for NDK: ${os}")
}

def resolveNdkDir = {
    def ndkDirPath = getProps('ndk.dir') ?: System.getenv('ANDROID_NDK_ROOT') ?: System.getenv('ANDROID_NDK_HOME')
    if (ndkDirPath != null && !ndkDirPath.isBlank()) {
        return file(ndkDirPath)
    }
    def sdkDirPath = getProps('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (sdkDirPath != null && !sdkDirPath.isBlank()) {
        def candidate = file("${sdkDirPath}/ndk/27.2.12479018")
        if (candidate.exists()) {
            return candidate
        }
    }
    return null
}

def resolvedNdkDir = resolveNdkDir()

configurations.all {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'org.jetbrains', module: 'annotations-java5'
}

android {
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"

    // splits.abi is not flavor-aware; the plugin flavor prunes x86_64 and universal below.
    splits {
        abi {
            enable = true
            reset()
            include(*(nativeTarget.isBlank() ? normalAbis : [nativeTarget]))
            universalApk = nativeTarget.isBlank()
        }
    }

    flavorDimensions 'runtime'

    productFlavors {
        normal {
            dimension 'runtime'
            ndk.abiFilters.addAll(normalAbis)
            externalNativeBuild.cmake.arguments '-DENABLE_PLUGINS=OFF'
        }
        plugin {
            dimension 'runtime'
            ndk.abiFilters.addAll(pluginAbis)
            externalNativeBuild.cmake.arguments '-DENABLE_PLUGINS=ON'
            proguardFiles 'proguard-plugin-rules.pro'
            consumerProguardFiles 'proguard-plugin-rules.pro'
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['./jni/']
    sourceSets.plugin.jniLibs.srcDirs += "$buildDir/generated/chaquopyJniLibs"
    sourceSets.plugin.assets.srcDirs += "$buildDir/generated/chaquopyBootstrapNative"
    sourceSets.plugin.assets.srcDirs += "$buildDir/generated/chaquopyStdlib"
    sourceSets.plugin.assets.srcDirs += "$buildDir/generated/chaquopyBootstrap"
    // Generated build.json carries the hashes of the assets packaged in this build.
    sourceSets.plugin.assets.srcDirs += "$buildDir/generated/chaquopyBuildJson"

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.31.6'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21

        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.31.6'
                def cmakeArgs = ['-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21']
                if (getProps('QUIET_NATIVE_BUILD')) {
                    cmakeArgs += '-DQUIET_BUILD=ON'
