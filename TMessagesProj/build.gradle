def chaquopyTargetJniConfig = configurations.getByName("chaquopyTargetJni")
def chaquopyStdlibPycConfig = configurations.getByName("chaquopyStdlibPyc")
def chaquopyGradlePluginConfig = configurations.getByName("chaquopyGradlePlugin")

// The Chaquopy Java bridge is compiled from source (jni/chaquopy). Recipe mirrors upstream
// Chaquopy 16.1.0 product/runtime: Cython 3.0.11 -> NDK clang at the app's minSdk level.
// Artifacts per ABI:
//   chaquopy.so         - Cython bootstrap module (asset chaquopy/bootstrap-native/<abi>/java/)
//   libchaquopy_java.so - JNI bridge for com.chaquo.python.* (lib/<abi>/)
def chaqSrcDir = file('jni/chaquopy')
def chaqGenDir = layout.buildDirectory.dir('chaquopy')

def chaqClangTargets = ['armeabi-v7a': 'armv7a-linux-androideabi27', 'arm64-v8a': 'aarch64-linux-android27']

def cythonizeChaquopy = tasks.register("cythonizeChaquopy", ChaquopyCythonize) {
    def inDir = new File(chaqSrcDir, 'java')
    pyxFile.fileValue(new File(inDir, 'chaquopy.pyx'))
    includes.from(fileTree(inDir) { include('*.pxi', '*.pxd') })
    outCFile.set(chaqGenDir.map { it.file('cython/chaquopy.c') })
}

def cythonizeChaquopyJava = tasks.register("cythonizeChaquopyJava", ChaquopyCythonize) {
    pyxFile.fileValue(new File(chaqSrcDir, 'chaquopy_java.pyx'))
    includes.from(fileTree(chaqSrcDir) { include('java/*.pxd') })
    outCFile.set(chaqGenDir.map { it.file('cython/chaquopy_java.c') })
}

// CPython headers (include/python3.11) and the linkable runtime (jniLibs/<abi>/libpython3.11.so)
// come from the Chaquopy target artifacts, keeping the bridge ABI-paired with the bundled CPython.
// include/ is ABI-dependent (pyconfig.h), so each ABI gets its own extraction.
chaquopyAbis.each { abi ->
    def extractTarget = tasks.register("extractChaquopyTarget_${abi}", Sync) {
        def outputDir = file("$buildDir/chaquopy/target/${abi}")
        inputs.files(chaquopyTargetJniConfig)
        outputs.dir(outputDir)
        into(outputDir)
        from({ chaquopyTargetJniConfig.filter { it.name.endsWith("-${abi}.zip") }.files.collect { zipTree(it) } }) {
            include('include/**', 'jniLibs/**')
            includeEmptyDirs = false
        }
    }

    def compileBridge = { String taskName, cythonTask, List<String> extraSources, List<String> libs, String soName ->
        tasks.register(taskName, ChaquopyClangLink) {
            dependsOn(cythonTask, extractTarget)
            sources.from(cythonTask.flatMap { it.outCFile })
            sources.from(extraSources)
            includeDirs.from(new File(chaqSrcDir, 'c'))
            includeDirs.from(extractTarget.map { new File(it.destinationDir, 'include/python3.11') })
            linkDir.fileValue(file("$buildDir/chaquopy/target/${abi}/jniLibs/${abi}"))
            linkLibs.set(libs)
            targetTriple.set(chaqClangTargets[abi])
            if (resolvedNdkDir != null) {
                ndkDirPath.set(resolvedNdkDir.absolutePath)
            }
            outFile.set(chaqGenDir.map { it.file("lib/${abi}/${soName}") })
        }
    }

    compileBridge("compileChaquopy_${abi}", cythonizeChaquopy, [], ['python3.11', 'dl', 'android'], 'chaquopy.so')
    compileBridge("compileChaquopyJava_${abi}", cythonizeChaquopyJava,
            [new File(chaqSrcDir, 'c/android_platform.c')], ['python3.11', 'log'], 'libchaquopy_java.so')
}


tasks.register("prepareChaquopyJniLibs", Sync) {
    def outputDir = file("$buildDir/generated/chaquopyJniLibs")
    inputs.files(chaquopyTargetJniConfig)
    outputs.dir(outputDir)
    into(outputDir)
    from(chaquopyTargetJniConfig.collect { zipTree(it) }) {
        include('jniLibs/**')
        eachFile {
            relativePath = new RelativePath(!file.isDirectory(), *relativePath.segments[1..-1])
        }
        includeEmptyDirs = false
    }
    chaquopyAbis.each { abi ->
        from(file("$buildDir/chaquopy/lib/${abi}/libchaquopy_java.so")) {
            into abi
        }
    }
    dependsOn(chaquopyAbis.collect { "compileChaquopyJava_${it}" })
    doFirst {
        if (resolvedNdkDir == null || !resolvedNdkDir.exists()) {
            throw new GradleException("Android NDK directory is unavailable, cannot package libc++_shared.so for plugin runtime.")
        }
    }
    chaquopyAbis.each { abi ->
        def triple = abiToNdkTriple[abi]
        if (triple == null) {
            throw new GradleException("Unsupported ABI for plugin runtime packaging: ${abi}")
        }
        def stlFile = new File(resolvedNdkDir, "toolchains/llvm/prebuilt/${ndkHostTag()}/sysroot/usr/lib/${triple}/libc++_shared.so")
        from(stlFile) {
            into abi
        }
    }
}

// bootstrap-native/<abi>/ = CPython extension modules from the target zip's lib-dynload/ plus
// the java/chaquopy.so Cython module built above.
tasks.register("prepareChaquopyBootstrapNative", Sync) {
    def outputDir = file("$buildDir/generated/chaquopyBootstrapNative")
    inputs.files(chaquopyTargetJniConfig)
    outputs.dir(outputDir)
    into(outputDir)
    from(chaquopyTargetJniConfig.collect { zipTree(it) }) {
        include('lib-dynload/**')
        eachFile { fcd ->
            def segs = fcd.relativePath.segments
            if (segs.length >= 2 && segs[0] == 'lib-dynload') {
                fcd.relativePath = new RelativePath(true, 'chaquopy', 'bootstrap-native', *segs[1..-1])
            } else {
                fcd.exclude()
            }
        }
        includeEmptyDirs = false
    }
    chaquopyAbis.each { abi ->
        from(file("$buildDir/chaquopy/lib/${abi}/chaquopy.so")) {
            into "chaquopy/bootstrap-native/${abi}/java"
        }
    }
    dependsOn(chaquopyAbis.collect { "compileChaquopy_${it}" })
}

