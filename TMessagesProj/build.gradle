tasks.register("stageChaquopyStdlibCommon", Copy) {
    from(chaquopyStdlibPycConfig) { rename { 'stdlib-common.imy' } }
    into("$buildDir/generated/chaquopyStdlib/chaquopy")
}

// Freeze bootstrap.imy + cacert.pem from repo python sources + the upstream gradle plugin jar.
tasks.register("stageChaquopyBootstrap", ChaquopyFreezeBootstrap) {
    pluginJar.set(layout.file(chaquopyGradlePluginConfig.elements.map { it.iterator().next().getAsFile() }))
    bootstrapDir.fileValue(file("jni/chaquopy/bootstrap"))
    outDir.set(layout.buildDirectory.dir("generated/chaquopyBootstrap"))
}

tasks.register("stageChaquopyAppImy") {
    def appImy = file("$buildDir/generated/chaquopyStdlib/chaquopy/app.imy")
    outputs.file(appImy)
    doLast {
        appImy.parentFile.mkdirs()
        new java.util.zip.ZipOutputStream(new FileOutputStream(appImy)).close()
    }
}

chaquopyAbis.each { abi ->
    tasks.register("stageChaquopyStdlibAbi_${abi}", ChaquopyFreezeStdlibAbi) {
        def abiZip = chaquopyTargetJniConfig.filter { it.name.endsWith("-${abi}.zip") }.elements
        targetZip.set(layout.file(abiZip.map { files -> files.iterator().next().getAsFile() }))
        moduleNames.set(chaquopyStdlibAbiModules)
        outFile.set(layout.buildDirectory.file("generated/chaquopyStdlib/chaquopy/stdlib-${abi}.imy"))
    }
}

// build.json hashes gate asset re-extraction on app update; regenerate them for each build.
tasks.register("generateChaquopyBuildJson", ChaquopyBuildJson) {
    dependsOn('prepareChaquopyBootstrapNative', 'stageChaquopyStdlibCommon', 'stageChaquopyAppImy',
              'stageChaquopyBootstrap',
              *chaquopyAbis.collect { "stageChaquopyStdlibAbi_${it}" })
    assetDirs.from(
        file("src/plugin/assets/chaquopy"),
        file("$buildDir/generated/chaquopyBootstrapNative/chaquopy"),
        file("$buildDir/generated/chaquopyBootstrap/chaquopy"),
        file("$buildDir/generated/chaquopyStdlib/chaquopy"))
    outFile.set(layout.buildDirectory.file('generated/chaquopyBuildJson/chaquopy/build.json'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        boolean isPluginFlavor = variant.name.startsWith('plugin')
        if (isPluginFlavor) {
            // AGP 9 has no per-variant preBuild tasks; wire to the merge tasks instead.
            tasks.matching {
                it.name.startsWith("merge${variant.name.capitalize()}") &&
                        (it.name.endsWith('JniLibFolders') || it.name.endsWith('Assets'))
            }.configureEach {
                dependsOn('prepareChaquopyJniLibs', 'prepareChaquopyBootstrapNative',
                          'stageChaquopyStdlibCommon', 'stageChaquopyAppImy', 'stageChaquopyBootstrap',
                          *chaquopyAbis.collect { "stageChaquopyStdlibAbi_${it}" },
                          'generateChaquopyBuildJson')
            }
        }
    }
}

def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}

// Shared first step: init submodules and apply source-tree patches (idempotent).
// All per-ABI tasks depend on this so patches are applied exactly once.
task patchNativeSources {
    description = 'Init native submodules and apply source patches.'
    doLast {
        providers.exec {
            workingDir rootDir
            commandLine 'git', 'submodule', 'update', '--init',
                'TMessagesProj/jni/third_party/libvpx',
                'TMessagesProj/jni/third_party/ffmpeg',
                'TMessagesProj/jni/third_party/dav1d',
                'TMessagesProj/jni/third_party/xiph/ogg',
                'TMessagesProj/jni/third_party/xiph/opus',
                'TMessagesProj/jni/third_party/xiph/opusfile',
                'TMessagesProj/jni/third_party/openh264',
                'TMessagesProj/jni/third_party/libyuv',
                'TMessagesProj/jni/tlottie',
                'TMessagesProj/jni/boringssl',
                'TMessagesProj/jni/td'
        }.result.get()
        def ffmpegDir = file("${projectDir}/jni/third_party/ffmpeg")
        def ffmpegSha = providers.exec {
            commandLine 'git', '-C', ffmpegDir.toString(), 'rev-parse', 'HEAD'
        }.standardOutput.asText.get().trim()
        new File(ffmpegDir, 'VERSION').text = ffmpegSha + '\n'

        def ndkDir = android.ndkDirectory.toString()
        def ninjaPath = System.getenv('NINJA_PATH') ?: 'ninja'
        for (script in ['patch_boringssl.sh', 'patch_dav1d.sh', 'patch_td.sh']) {
            providers.exec {
                workingDir "${projectDir}/jni"
                environment 'NDK', ndkDir
                environment 'NINJA_PATH', ninjaPath
                commandLine 'bash', script
            }.result.get()
        }
    }
}

